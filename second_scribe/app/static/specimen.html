<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Type specimen</title>
<link rel="stylesheet" href="css/fonts.css">
<style>
  body { margin: 0; padding: 8px 24px; background: #0f1216; color: #ece8df; }
  .row { font-size: 150px; line-height: 1.15; margin: 0; white-space: nowrap; }
  .serif { font-family: "Schibsted Grotesk", sans-serif; font-weight: 600; }
  .serif.regular { font-weight: 400; }
  .sans { font-family: "Schibsted Grotesk", sans-serif; font-weight: 900; }
  .mono { font-family: "JetBrains Mono", monospace; font-weight: 400; }
</style>
</head>
<body>
<p class="row serif">fact ff fi fl g a y</p>
<p class="row serif regular">fact ff fi fl g a y</p>
<p class="row sans">fact ff fi fl g a y</p>
<p class="row mono">fact ff fi fl g a y</p>
<p class="row mono">0O1lI {} sha256</p>
</body>
</html>
